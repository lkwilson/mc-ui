<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe14f" />
      <stop offset="1" stop-color="#5aa02c" />
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6a3c" />
      <stop offset="1" stop-color="#6b4423" />
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4423" />
      <stop offset="1" stop-color="#452c15" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)" />
  <!-- isometric grass block -->
  <g>
    <!-- left dirt face -->
    <path d="M6 11.5 L16 17 L16 25 L6 19.5 Z" fill="url(#left)" />
    <!-- right dirt face -->
    <path d="M26 11.5 L16 17 L16 25 L26 19.5 Z" fill="url(#right)" />
    <!-- grass overhang on the sides -->
    <path d="M6 11.5 L16 17 L16 19.2 L6 13.7 Z" fill="#5c9e34" />
    <path d="M26 11.5 L16 17 L16 19.2 L26 13.7 Z" fill="#4c8a2b" />
    <!-- grass top -->
    <path d="M16 6 L26 11.5 L16 17 L6 11.5 Z" fill="url(#top)" />
    <!-- top highlight edge -->
    <path d="M16 6 L26 11.5 L16 17 L6 11.5 Z" fill="none" stroke="#a7f56b" stroke-width="0.6" stroke-opacity="0.5" />
  </g>
</svg>
